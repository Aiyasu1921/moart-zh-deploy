name: Deploy to GitHub Pages

# 停用 push 自动触发：仓库 Pages 使用 "Deploy from a branch" 内置部署，
# 自定义工作流再触发会与内置部署抢同一环境导致 deploy 失败。仅保留手动触发。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
